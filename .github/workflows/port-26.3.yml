name: Port 26.3

on:
  push:
    branches: ["26.3"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Create or update 26.3 source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d versions/26.3 ]; then
            cp -a versions/26.2 versions/26.3
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('versions/26.3/gradle.properties')
          s = p.read_text()
          for a,b in [
              ('minecraft_version=26.2','minecraft_version=26.3'),
              ('loader_version=0.19.3','loader_version=0.19.5'),
              ('loom_version=1.16.3','loom_version=1.17.21'),
              ('artifact_minecraft_version=26.2.x','artifact_minecraft_version=26.3'),
              ('fabric_api_version=0.156.0+26.2','fabric_api_version=0.161.0+26.3'),
          ]: s=s.replace(a,b)
          p.write_text(s)

          p = Path('versions/26.3/build.gradle')
          s = p.read_text()
          for line in [
              'sourceSets.client.java.exclude("bettershulkerhud/compat/ReiExclusionPlugin.java")',
              'sourceSets.client.resources.exclude("better-shulker-hud.client.mixins.json")',
          ]:
              s=s.replace(line+'\n\n','')
          if 'bettershulkerhud/compat/ReiExclusionPlugin.java' not in s:
              s=s.replace("    mavenCentral()", "    mavenCentral()\n    maven { url 'https://cursemaven.com' }")
          for a,b in [
              ('quickshulker:3.0.2-26.2','quickshulker:3.1.0-26.3'),
              ("compileOnly('me.shedaniel:RoughlyEnoughItems-api:26.2.821')", "// REI has no published 26.3 Maven artifact yet; its optional plugin is disabled for this build."),
              ("compileOnly('mezz.jei:jei-26.2-fabric-api:30.15.0.118')", "compileOnly('curse.maven:jei-238222:8918191')"),
              ('malilib-fabric-26.2:0.29.0','malilib-fabric-26.3:0.30.1'),
          ]: s=s.replace(a,b)
          p.write_text(s)

          p = Path('versions/26.3/src/client/java/bettershulkerhud/compat/ReiExclusionPlugin.java')
          if p.exists(): p.unlink()

          p = Path('versions/26.3/src/main/resources/fabric.mod.json')
          if p.exists():
              data=json.loads(p.read_text())
              data['depends']['minecraft']='>=26.3 <26.4'
              data['depends']['fabricloader']='>=0.19.5'
              data['recommends']['malilib']='>=0.30.0 <0.31.0'
              data['suggests']['quickshulker']='3.1.0-26.3'
              data['suggests']['roughlyenoughitems']='>=26.3'
              data['entrypoints'].pop('rei_client', None)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('versions/26.3/src/client/resources/better-shulker-hud.client.mixins.json')
          if p.exists():
              p.write_text(p.read_text().replace('26.2','26.3'))

          p = Path('versions/26.3/settings.gradle')
          if p.exists(): p.write_text(p.read_text().replace('26.2','26.3'))
          PY

      - name: Set Gradle 9.6
        shell: bash
        run: |
          set -euo pipefail
          cd versions/26.3
          sed -i 's#gradle-[0-9][^/]*/bin/gradle-[^/]*-bin.zip#gradle-9.6.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-9.6.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties || true
          chmod +x gradlew

      - name: Build 26.3
        shell: bash
        run: |
          set -euo pipefail
          cd versions/26.3
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterShulkerHUD-26.3
          path: versions/26.3/build/libs/*.jar
          if-no-files-found: error

      - name: Commit generated 26.3 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/26.3
          if git diff --cached --quiet; then
            echo 'No generated source changes to commit.'
          else
            git commit -m 'chore: update Minecraft 26.3 port'
            git push origin HEAD:26.3
          fi
