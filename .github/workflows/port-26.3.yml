name: Port 26.3

on:
  push:
    branches: ["26.3"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Create or update 26.3 source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f versions/26.3/gradle.properties ] || [ ! -f versions/26.3/build.gradle ] || [ ! -x versions/26.3/gradlew ]; then
            rm -rf versions/26.3
            cp -a versions/26.2 versions/26.3
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          p = Path('versions/26.3/gradle.properties')
          s = p.read_text()
          for a,b in [('minecraft_version=26.2','minecraft_version=26.3'),('loader_version=0.19.3','loader_version=0.19.5'),('loom_version=1.16.3','loom_version=1.17.21'),('artifact_minecraft_version=26.2.x','artifact_minecraft_version=26.3'),('fabric_api_version=0.156.0+26.2','fabric_api_version=0.161.0+26.3')]: s=s.replace(a,b)
          p.write_text(s)
          p = Path('versions/26.3/build.gradle')
          s = p.read_text()
          if 'maven { url \'https://cursemaven.com\' }' not in s: s=s.replace('    mavenCentral()', "    mavenCentral()\n    maven { url 'https://cursemaven.com' }")
          for a,b in [('quickshulker:3.0.2-26.2','quickshulker:3.1.0-26.3'),("compileOnly('me.shedaniel:RoughlyEnoughItems-api:26.2.821')",'// REI optional on 26.3'),("compileOnly('mezz.jei:jei-26.2-fabric-api:30.15.0.118')","compileOnly('curse.maven:jei-238222:8918191')"),('malilib-fabric-26.2:0.29.0','malilib-fabric-26.3:0.30.1')]: s=s.replace(a,b)
          p.write_text(s)
          for p in Path('versions/26.3').rglob('ReiExclusionPlugin.java'):
              p.unlink()
          p = Path('versions/26.3/src/main/java/bettershulkerhud/server/BundleStorageAccess.java')
          if p.exists():
              s=p.read_text().replace('itemCopyStream()', 'itemCopies()').replace('new BundleContents.Mutable(contents)', 'contents.asMutable()')
              p.write_text(s)
          p = Path('versions/26.3/src/main/resources/fabric.mod.json')
          if p.exists():
              data=json.loads(p.read_text()); data['depends']['minecraft']='>=26.3 <26.4'; data['depends']['fabricloader']='>=0.19.5'; data['recommends']['malilib']='>=0.30.0 <0.31.0'; data['suggests']['quickshulker']='3.1.0-26.3'; data['entrypoints'].pop('rei_client',None); p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          for p in Path('versions/26.3').rglob('*.mixins.json'):
              p.write_text(p.read_text().replace('26.2','26.3'))
          p = Path('versions/26.3/settings.gradle')
          if p.exists(): p.write_text(p.read_text().replace('26.2','26.3'))

          # 26.3 switched Minecraft's low-level input layer from GLFW to SDL3.
          glfw_map = {
              'GLFW_MOUSE_BUTTON_LEFT':'MOUSE_BUTTON_LEFT', 'GLFW_MOUSE_BUTTON_RIGHT':'MOUSE_BUTTON_RIGHT',
              'GLFW_MOUSE_BUTTON_MIDDLE':'MOUSE_BUTTON_MIDDLE', 'GLFW_MOD_SHIFT':'MOD_SHIFT',
              'GLFW_MOD_CONTROL':'MOD_CONTROL', 'GLFW_MOD_ALT':'MOD_ALT',
              'GLFW_KEY_BACKSPACE':'KEY_BACKSPACE', 'GLFW_KEY_ESCAPE':'KEY_ESCAPE',
              'GLFW_KEY_SPACE':'KEY_SPACE', 'GLFW_KEY_V':'KEY_V', 'GLFW_KEY_CAPS_LOCK':'KEY_CAPSLOCK',
              'GLFW_KEY_LEFT_SHIFT':'KEY_LSHIFT', 'GLFW_KEY_RIGHT_SHIFT':'KEY_RSHIFT',
              'GLFW_KEY_LEFT_CONTROL':'KEY_LCONTROL', 'GLFW_KEY_RIGHT_CONTROL':'KEY_RCONTROL',
              'GLFW_KEY_LEFT_ALT':'KEY_LALT', 'GLFW_KEY_RIGHT_ALT':'KEY_RALT',
              'GLFW_KEY_ENTER':'KEY_RETURN', 'GLFW_KEY_KP_ENTER':'KEYCODE_NUMPADENTER'
          }
          for p in Path('versions/26.3/src/client/java').rglob('*.java'):
              s = p.read_text()
              if 'org.lwjgl.glfw.GLFW' in s:
                  s = s.replace('import org.lwjgl.glfw.GLFW;', 'import com.mojang.blaze3d.platform.InputConstants;')
                  for a,b in glfw_map.items(): s=s.replace('GLFW.'+a, 'InputConstants.'+b)
              s = s.replace('.itemCopyStream()', '.itemCopies()')
              s = re.sub(r'new BundleContents\.Mutable\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)', r'\1.asMutable()', s)
              p.write_text(s)

          p = Path('versions/26.3/src/client/java/betterbundle/mixin/ItemScrollerInputHandlerMixin.java')
          if p.exists():
              s=p.read_text().replace('import fi.dy.masa.malilib.util.InputUtils;\n','')
              s=s.replace('InputUtils.getMouseX()', '(int) client.mouseHandler.xpos()')
              s=s.replace('InputUtils.getMouseY()', '(int) client.mouseHandler.ypos()')
              p.write_text(s)

          p = Path('versions/26.3/src/client/java/betterbundle/compat/QuickShulkerExtractionController.java')
          if p.exists():
              s=p.read_text()
              s=s.replace('GLFW.glfwGetCursorPos(window, cursorX, cursorY);', 'cursorX[0] = Minecraft.getInstance().mouseHandler.xpos(); cursorY[0] = Minecraft.getInstance().mouseHandler.ypos();')
              s=s.replace('GLFW.glfwSetCursorPos(window, cursorX[0], cursorY[0]);', '// SDL3 cursor warp is intentionally omitted on 26.3')
              s=s.replace('import org.lwjgl.glfw.GLFW;\n','')
              p.write_text(s)
          PY

      - name: Set Gradle 9.6
        shell: bash
        run: |
          set -euo pipefail
          cd versions/26.3
          sed -i 's#gradle-[0-9][^/]*/bin/gradle-[^/]*-bin.zip#gradle-9.6.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-9.6.0-bin.zip#' gradle/wrapper/gradle-wrapper.properties || true
          chmod +x gradlew

      - name: Build 26.3
        shell: bash
        run: |
          set -euo pipefail
          cd versions/26.3
          ./gradlew build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterShulkerHUD-26.3
          path: versions/26.3/build/libs/*.jar
          if-no-files-found: error

      - name: Commit generated 26.3 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/26.3
          if git diff --cached --quiet; then echo 'No generated source changes to commit.'; else git commit -m 'chore: update Minecraft 26.3 port'; git push origin HEAD:26.3; fi
