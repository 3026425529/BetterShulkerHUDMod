name: Port 26.3

on:
  push:
    branches: ["26.3"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: bootstrap generated 26.3') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create 26.3 source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -d versions/26.3 ]; then
            echo 'versions/26.3 already exists; nothing to bootstrap.'
            exit 0
          fi
          cp -a versions/26.2 versions/26.3
          python3 - <<'PY'
          from pathlib import Path
          p = Path('versions/26.3/gradle.properties')
          s = p.read_text()
          s = s.replace('minecraft_version=26.2', 'minecraft_version=26.3')
          s = s.replace('loader_version=0.19.3', 'loader_version=0.19.5')
          s = s.replace('loom_version=1.16.3', 'loom_version=1.17.21')
          s = s.replace('artifact_minecraft_version=26.2.x', 'artifact_minecraft_version=26.3')
          s = s.replace('fabric_api_version=0.156.0+26.2', 'fabric_api_version=0.161.0+26.3')
          p.write_text(s)

          p = Path('versions/26.3/build.gradle')
          s = p.read_text()
          s = s.replace('quickshulker:3.0.2-26.2', 'quickshulker:3.1.0-26.3')
          s = s.replace('RoughlyEnoughItems-api:26.2.821', 'RoughlyEnoughItems-api:26.3')
          s = s.replace('jei-26.2-fabric-api:30.15.0.118', 'jei-26.3-fabric-api:31.0.0')
          s = s.replace('malilib-fabric-26.2:0.29.0', 'malilib-fabric-26.3:0.30.1')
          p.write_text(s)

          p = Path('versions/26.3/settings.gradle')
          if p.exists():
            s = p.read_text().replace('26.2', '26.3')
            p.write_text(s)
          PY

          cd versions/26.3
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 9.6.0 --no-daemon

      - name: Commit generated source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions/26.3
          git commit -m 'chore: bootstrap generated 26.3 source tree'
          git push origin HEAD:26.3
